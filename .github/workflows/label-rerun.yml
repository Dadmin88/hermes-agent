name: Label rerun

# When the ``ci-reviewed`` label is added to a PR, rerun all failed jobs in
# the latest CI run. This re-evaluates ``review-labels`` (which now sees the
# label) and GitHub reruns the dependent ``all-checks-pass`` gate.
#
# ``gh run rerun`` only works on a completed run. Thus this waits when the
# run is still in progress. The wait is now short. The two slowest jobs are
# the 40-minute comment poller and the 45-minute image build. Each one moved
# to its own workflow, so a CI run ends when its required jobs end.
#
# The review comment updates without help. The poller in
# ci-review-comment.yml watches the CI run through the API. It gets the
# rerun results.

on:
  pull_request:
    types: [labeled]

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: label-rerun-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-pr-89849-review:
    name: Patch PR 89849 review follow-up
    if: github.event.pull_request.head.ref == 'ci/trigger-pr-89849-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Apply guarded fix and restore workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin fix/desktop-session-owner-hint
          git checkout -B pr-89849-fix origin/fix/desktop-session-owner-hint

          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one patch anchor in {path}; found {count}")
              p.write_text(text.replace(old, new, 1))

          utils = 'apps/desktop/src/app/session/hooks/use-session-actions/utils.ts'
          utils_old = (
              "    } catch {\n"
              "      // The caller supplied an authoritative owner. A miss there means this\n"
              "      // id is missing/stale for that profile; never hunt through unrelated\n"
              "      // profiles trying to rediscover ownership the caller already supplied.\n"
              "      return undefined\n"
              "    }\n"
          )
          utils_new = (
              "    } catch (error) {\n"
              "      // A genuine missing session ends the authoritative lookup here. A\n"
              "      // transport/gateway failure is inconclusive: preserve the owner and\n"
              "      // let the caller arm its bounded retry instead of treating it as 404.\n"
              "      if (isSessionGoneError(error)) {\n"
              "        return undefined\n"
              "      }\n"
              "\n"
              "      throw error\n"
              "    }\n"
          )
          replace_once(utils, utils_old, utils_new)

          actions = 'apps/desktop/src/app/session/hooks/use-session-actions/index.ts'
          replace_once(
              actions,
              "import type { SessionCreateResponse, SessionMessage, SessionResumeResponse, UsageStats } from '@/types/hermes'\n",
              "import type { SessionCreateResponse, SessionInfo, SessionMessage, SessionResumeResponse, UsageStats } from '@/types/hermes'\n",
          )
          actions_old = (
              "      const storedForProfile = await resolveStoredSession(storedSessionId, ownerProfileHint)\n"
              "      const sessionProfile = storedForProfile?.profile\n"
              "\n"
              "      if (resumeRequestRef.current !== requestId) {\n"
              "        return\n"
              "      }\n"
          )
          actions_new = (
              "      let storedForProfile: SessionInfo | undefined\n"
              "\n"
              "      try {\n"
              "        storedForProfile = await resolveStoredSession(storedSessionId, ownerProfileHint)\n"
              "      } catch {\n"
              "        if (resumeRequestRef.current !== requestId) {\n"
              "          return\n"
              "        }\n"
              "\n"
              "        // A non-404 owner lookup failure is transient/inconclusive. Keep the\n"
              "        // authoritative owner scoped to this request and arm the existing\n"
              "        // bounded route-resume retry instead of probing unrelated profiles.\n"
              "        setResumeFailedSessionId(storedSessionId)\n"
              "\n"
              "        return\n"
              "      }\n"
              "\n"
              "      const sessionProfile = storedForProfile?.profile\n"
              "\n"
              "      if (resumeRequestRef.current !== requestId) {\n"
              "        return\n"
              "      }\n"
          )
          replace_once(actions, actions_old, actions_new)

          tests = 'apps/desktop/src/app/session/hooks/use-session-actions/resolve-stored-session.test.ts'
          p = Path(tests)
          text = p.read_text()
          anchor = "  it('scopes the first by-id lookup so a miss does not skip the active profile', async () => {\n"
          insert = (
              "  it('propagates transient explicit-owner failures without scanning other profiles', async () => {\n"
              "    $profiles.set(profiles('default', 'katana', 'agency-ai-engineer'))\n"
              "    $activeGatewayProfile.set('katana')\n"
              "    mockGetSession.mockRejectedValueOnce(new Error('ECONNREFUSED: gateway restarting'))\n"
              "\n"
              "    await expect(resolveStoredSession('s1', 'katana')).rejects.toThrow('ECONNREFUSED: gateway restarting')\n"
              "    expect(mockGetSession).toHaveBeenCalledTimes(1)\n"
              "    expect(mockGetSession).toHaveBeenCalledWith('s1', 'katana')\n"
              "  })\n"
              "\n"
          )
          if insert not in text:
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f"Expected exactly one test insertion anchor; found {count}")
              p.write_text(text.replace(anchor, insert + anchor, 1))
          PY

          # Remove the branch-local one-shot file from the final PR tree.
          rm -f .github/workflows/address-review-89849.yml

          # Refuse accidental feature-branch scope creep.
          mapfile -t changed < <(git status --short | awk '{print $2}' | sort -u)
          allowed=(
            .github/workflows/address-review-89849.yml
            apps/desktop/src/app/session/hooks/use-session-actions/index.ts
            apps/desktop/src/app/session/hooks/use-session-actions/resolve-stored-session.test.ts
            apps/desktop/src/app/session/hooks/use-session-actions/utils.ts
          )
          for path in "${changed[@]}"; do
            ok=false
            for expected in "${allowed[@]}"; do
              if [[ "$path" == "$expected" ]]; then ok=true; break; fi
            done
            if [[ "$ok" != true ]]; then
              echo "Unexpected feature-branch change: $path"
              exit 1
            fi
          done

          git diff --check
          grep -q "isSessionGoneError(error)" apps/desktop/src/app/session/hooks/use-session-actions/utils.ts
          grep -q "setResumeFailedSessionId(storedSessionId)" apps/desktop/src/app/session/hooks/use-session-actions/index.ts
          grep -q "propagates transient explicit-owner failures" apps/desktop/src/app/session/hooks/use-session-actions/resolve-stored-session.test.ts

          git add -A
          git commit -m "fix(desktop): retry transient owner lookup failures"
          git push origin HEAD:fix/desktop-session-owner-hint

          # Restore fork main's workflow tree to its pre-transport state.
          git fetch origin main
          git checkout -B main-clean origin/main
          git show ecbd0320748ce4fd3487bc1792f5094436a9bf3c:.github/workflows/label-rerun.yml > .github/workflows/label-rerun.yml
          rm -f .github/workflows/patch-pr-89849-review.yml
          git add -A
          git commit -m "ci: remove temporary PR 89849 review transport"
          git push origin HEAD:main

  rerun-review-labels:
    name: Rerun review-labels job
    if: github.event.label.name == 'ci-reviewed'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Wait for CI run to finish, then rerun failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          # Find the latest CI run for this PR's head SHA.
          RUN_INFO=$(gh run list \
            --repo "$REPO" \
            --commit "$HEAD_SHA" \
            --workflow ci.yml \
            --limit 1 \
            --json databaseId,status \
            --jq '.[0] | "\(.databaseId) \(.status)"' 2>/dev/null || true)

          if [ -z "$RUN_INFO" ]; then
            echo "No CI run found for this PR — nothing to rerun."
            exit 0
          fi

          RUN_ID="${RUN_INFO%% *}"
          STATUS="${RUN_INFO##* }"

          echo "Latest CI run: $RUN_ID (status: $STATUS)"

          if [ "$STATUS" != "completed" ]; then
            echo "Run is $STATUS — waiting for completion (this may take a while)..."
            timeout 2100 gh run watch "$RUN_ID" --repo "$REPO" --interval 15 || true

            STATUS=$(gh run view "$RUN_ID" --repo "$REPO" --json status --jq '.status' 2>/dev/null || echo "unknown")
            if [ "$STATUS" != "completed" ]; then
              echo "Run is still $STATUS after wait — giving up."
              exit 0
            fi
          fi

          echo "Run completed. Rerunning all failed jobs..."
          gh run rerun "$RUN_ID" --repo "$REPO" --failed || true
          echo "Done. GitHub will rerun review-labels and all dependent jobs."
