name: CI (Gitea)

on:
  push:
    branches: [main, ci/nonroot-python-proof]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitea-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.9.28"
  PYTHON_VERSION: "3.11"

jobs:
  python-tests:
    name: Python regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Neutralize minimized man stub
        run: |
          set -euo pipefail
          if [ -f /usr/bin/man ] && grep -q 'This system has been minimized' /usr/bin/man; then
            sudo chmod a-x /usr/bin/man
          fi
          python3 - <<'PY'
          import shutil
          print(f"man={shutil.which('man')}")
          PY

      - name: Install ripgrep
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Prepare GitHub-like non-root test identity
        run: |
          set -euo pipefail
          install -d -o ubuntu -g ubuntu /home/ubuntu
          chown -R ubuntu:ubuntu "$GITHUB_WORKSPACE"

      - name: Install Python as non-root
        run: |
          set -euo pipefail
          sudo -u ubuntu -H env PATH="$PATH" uv python install "${PYTHON_VERSION}"

      - name: Install locked test dependencies as non-root
        run: |
          set -euo pipefail
          sudo -u ubuntu -H env PATH="$PATH" \
            uv sync --locked --python "${PYTHON_VERSION}" \
            --extra all --extra dev --extra anthropic --extra mistral \
            --extra fal --extra modal --extra daytona --extra hindsight \
            --extra parallel-web

      - name: Run canonical Hermes test suite
        run: |
          set -euo pipefail
          sudo -u ubuntu -H env \
            PATH="$PATH" \
            HERMES_TEST_WORKERS="2" \
            OPENROUTER_API_KEY="" \
            OPENAI_API_KEY="" \
            NOUS_API_KEY="" \
            scripts/run_tests.sh

  quality:
    name: Python static quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Python
        run: uv python install "${PYTHON_VERSION}"

      - name: Install locked development dependencies
        run: uv sync --locked --python "${PYTHON_VERSION}" --extra dev

      - name: Check patch whitespace
        run: git diff --check

      - name: Ruff enforcement
        run: uv run ruff check .

      - name: Windows footgun guard
        run: uv run python scripts/check-windows-footguns.py --all

      - name: Verify lockfile
        run: uv lock --check

  javascript:
    name: JavaScript and TypeScript checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Use npm 12
        run: npm --version | grep -q '^12\.' || npm i -g npm@12

      - name: Install locked dependencies
        run: npm ci

      - name: Discover maintained workspace checks
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const pkgs = JSON.parse(execSync('npm query .workspace', { encoding: 'utf-8' }));
          if (pkgs.length === 0) {
            throw new Error('Workspace discovery returned no packages');
          }
          const checks = [];
          for (const pkg of pkgs) {
            const scripts = pkg.scripts || {};
            const subs = Object.keys(scripts).filter((s) => /^check:.+$/.test(s));
            if (subs.length > 0) {
              for (const script of subs) checks.push({ package: pkg.location, script });
            } else if (scripts.check) {
              checks.push({ package: pkg.location, script: 'check' });
            }
          }
          if (checks.length === 0) {
            throw new Error('No maintained workspace check scripts found');
          }
          fs.writeFileSync('gitea-js-checks.json', JSON.stringify(checks, null, 2));
          console.log(`Discovered ${checks.length} maintained workspace checks`);
          NODE

      - name: Run maintained workspace checks serially
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          with open('gitea-js-checks.json', encoding='utf-8') as fh:
              checks = json.load(fh)
          for item in checks:
              package = item['package']
              script = item['script']
              print(f'::group::{package} / {script}', flush=True)
              if package == 'apps/desktop' and script == 'check:test:ui':
                  subprocess.run(['npm', 'run', '--prefix', package, 'test:ui', '--', '--testTimeout=60000'], check=True)
              else:
                  subprocess.run(['npm', 'run', '--prefix', package, script], check=True)
              print('::endgroup::', flush=True)
          PY
